# Gia Ký — production, on the ezgo host (etopfunvalue.com).
#
# This file is copied to /etc/giaky/docker-compose.yml by the Deploy stage of
# deploy/prod/Jenkinsfile; it is never run from a developer checkout. Images come from the
# DigitalOcean registry the Jenkins host pushed them to.
#
# Topology (differs from staging, which uses host networking):
#   - the two containers share a private bridge network; the API is NOT published to the host,
#     so the only way to reach it is through the web container's nginx;
#   - the web container publishes 127.0.0.1:${WEB_PORT} only — the host's nginx terminates TLS
#     for giaky.etopfunvalue.com and proxies to it, exactly as it does for ezgo on 8081.
#
# Every value below comes from /etc/giaky/giaky.env, which Jenkins writes with umask 077 from its
# credential store. `${VAR:?}` makes compose refuse to start rather than fall back to a default.

name: giaky-prod

services:
  api:
    image: ${REGISTRY:?}/giaky-api:${IMAGE_TAG:?}
    container_name: giaky-prod-api
    restart: unless-stopped
    networks: [giaky]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ISSUER: ${JWT_ISSUER:-giaky}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      # Encrypts the SMTP password a super admin saves. Required: the API refuses to start without it.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?}
      # Comma-separated; each account must also verify its address before it counts.
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      API_BASE_URL: ${PUBLIC_URL:?}
      WEB_BASE_URL: ${PUBLIC_URL:?}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?}
      # Off in production: the schema of every endpoint is not public documentation.
      SWAGGER_UI_ENABLED: "false"
      MEDIA_LOCAL_DIR: /data/media
    volumes:
      - media:/data/media
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: ${REGISTRY:?}/giaky-web:${IMAGE_TAG:?}
    container_name: giaky-prod-web
    restart: unless-stopped
    depends_on: [api]
    networks: [giaky]
    # Loopback only. A port published on 0.0.0.0 would sit in front of ufw, not behind it.
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:80"
    environment:
      LISTEN_PORT: "80"
      API_UPSTREAM: http://api:8080
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  giaky:
    name: giaky-prod

volumes:
  media:
    name: giaky-prod-media
