# Phase 0's packages are deliberately empty, so most layering rules currently match no classes.
# Without this, ArchUnit would fail every one of them for having nothing to check and the suite
# would be red on an empty repository — which teaches everyone to ignore it.
#
# Revisit once the contexts have real classes: turning this back on catches a rule whose package
# pattern has silently stopped matching anything (a rename, a moved package) and is therefore no
# longer enforcing what it claims to.
archRule.failOnEmptyShould=false
