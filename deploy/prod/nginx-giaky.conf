# Host nginx vhost for Gia Ký on the ezgo box (etopfunvalue.com).
#
# Install once, by hand (it is not deployed by the pipeline — the pipeline only moves containers):
#
#   scp deploy/prod/nginx-giaky.conf root@etopfunvalue.com:/etc/nginx/sites-available/giaky
#   ssh root@etopfunvalue.com 'ln -sf /etc/nginx/sites-available/giaky /etc/nginx/sites-enabled/giaky \
#       && nginx -t && systemctl reload nginx'
#   ssh root@etopfunvalue.com 'certbot --nginx -d giaky.etopfunvalue.com'
#
# certbot rewrites this file in place: it adds the TLS listeners and a redirect from :80. What is
# below is the plain-HTTP form it starts from, which is also what serves the ACME challenge.
#
# giaky.etopfunvalue.com must already resolve (an A record to this host) before certbot runs.

server {
    listen 80;
    listen [::]:80;
    server_name giaky.etopfunvalue.com;

    # Uploads: the API caps media itself, this is the outer bound.
    client_max_body_size 20m;
    server_tokens off;

    access_log /var/log/nginx/giaky.access.log;
    error_log  /var/log/nginx/giaky.error.log;

    location / {
        # The Gia Ký web container, published on loopback only by deploy/prod/docker-compose.yml.
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The container's nginx passes this through, so Spring sees https once certbot has run.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }
}
