# Base configuration — shared by every profile.
#
# Anything secret is read from the environment with NO default, so a misconfigured deployment
# fails at startup with "Could not resolve placeholder" rather than silently connecting somewhere
# unexpected. The `dev` profile supplies local-only defaults; `prod` deliberately does not.
spring:
  application:
    name: gia-ky-api

  autoconfigure:
    exclude:
      # Kept: there is no UserDetailsService and there will not be one. The only credential this
      # application understands is a token it minted itself, verified by JwtAuthenticationFilter,
      # so Spring Boot's default in-memory "user" account would be a second way in that nothing
      # uses and nobody audits.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  threads:
    virtual:
      enabled: true # Blocking JDBC on virtual threads (doc 06 §1).

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: giaky-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false # A lazy load outside a transaction is a bug, not a convenience.
    hibernate:
      ddl-auto: none # Flyway owns the schema. Always.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never # Error bodies come from GlobalExceptionHandler, not the servlet container.
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
  web:
    # Where the browser reaches the web client. Used to build the verification and password-reset
    # links, which are redeemed by the frontend rather than by this API — so it is the *web* origin
    # that belongs in them, not this one.
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  security:
    jwt:
      # No default: a deployment without a secret must fail at startup, not sign tokens with a
      # value someone could read in this file. Base64, decoding to at least 32 bytes (HS256).
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:giaky}
      # Doc 05 §5. Short on purpose — a bearer token cannot be recalled, so its window is the
      # whole of its blast radius. The refresh rotation makes it invisible to the user.
      access-token-ttl: 15m
    refresh-token:
      ttl: 30d
    verification:
      email-verify-ttl: 24h
      # An hour: a reset token is a complete account takeover sitting in an inbox.
      password-reset-ttl: 1h
    # FR-A2 requires at least 12. Raising it re-hashes nothing — the factor lives in each stored
    # hash, so old passwords keep verifying and new ones get the new cost.
    bcrypt-cost: ${BCRYPT_COST:12}
  cors:
    # Comma-separated. Empty by default: a profile must opt in.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  lineage:
    tree-cache:
      # The assembled tree, held per (clan, tree version) — B5.3. Bounded in *people* rather than in
      # entries, because one entry is one clan and clans differ by three orders of magnitude. The
      # default holds roughly forty clans the size of the NFR-1 fixture.
      max-people: ${TREE_CACHE_MAX_PEOPLE:200000}
      # On idle, not on write: the key carries the tree version, so an entry is either current or
      # already unreachable. This only evicts trees nobody is looking at.
      expire-after-access: ${TREE_CACHE_TTL:10m}
  platform:
    # Comma-separated addresses whose accounts are super admins: they manage every user on the
    # platform. An account qualifies only once its address is verified,
    # so registering the address first does not make a stranger the operator. Empty by default.
    super-admin-emails: ${SUPER_ADMIN_EMAILS:}
  media:
    # Where LocalFsMediaStorage writes uploads (Phase 7). Local directory in v1 — object storage
    # is a post-v1 adapter swap behind the same MediaStorage port.
    local-directory: ${MEDIA_LOCAL_DIR:./var/media}

logging:
  level:
    app.giaky: INFO
