# Gia Ký — staging, on the build host (192.168.1.100). Deployed by the Jenkinsfile at the repo root.
#
# Both containers use host networking:
#   - the API reaches PostgreSQL at 192.168.1.100:5432 exactly as any other local client does,
#     so pg_hba.conf needs no rule for Docker's bridge subnet;
#   - the API binds 127.0.0.1 only, so the one way in from the LAN is nginx on WEB_PORT.
#
# Secrets (DB_PASSWORD, JWT_SECRET, SMTP_PASSWORD) come from the environment — Jenkins injects them
# from its credential store. `${VAR:?}` makes compose refuse to start without the first two.

name: giaky-staging

services:
  api:
    image: giaky-api:${IMAGE_TAG:-staging}
    container_name: giaky-staging-api
    network_mode: host
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: ${API_PORT:-8180}
      DB_URL: ${DB_URL:-jdbc:postgresql://192.168.1.100:5432/giaky}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: giaky-staging
      API_BASE_URL: ${PUBLIC_URL:-http://192.168.1.100:8081}
      WEB_BASE_URL: ${PUBLIC_URL:-http://192.168.1.100:8081}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://192.168.1.100:8081}
      SWAGGER_UI_ENABLED: "true"
      MEDIA_LOCAL_DIR: /data/media
      # Verification and reset links by SMTP; an empty SMTP_HOST sends nothing (see application.yml).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - media:/data/media
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: giaky-web:${IMAGE_TAG:-staging}
    container_name: giaky-staging-web
    network_mode: host
    restart: unless-stopped
    depends_on: [api]
    environment:
      LISTEN_PORT: ${WEB_PORT:-8081}
      API_UPSTREAM: http://127.0.0.1:${API_PORT:-8180}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  media:
    name: giaky-staging-media
