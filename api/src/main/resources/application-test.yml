# Automated tests.
#
# The datasource is supplied at runtime by Testcontainers (see AbstractIntegrationTest), so the
# placeholders in application.yml are given inert defaults here — a test that reaches the database
# without a container should fail on connect, not on placeholder resolution.
#
# CoreConfig swaps in a fixed Clock and a deterministic IdGenerator under this profile: no test
# depends on when it runs or on the order ids happen to come out (doc 09 §4.6).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giaky_test_unconfigured}
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:test}

  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: http://localhost:5173
  media:
    local-directory: ${java.io.tmpdir}/giaky-test-media
  security:
    jwt:
      # Fixed, so a token minted in one test verifies in another and an expected value can be
      # asserted. Paired with CoreConfig's frozen clock, token expiry is something tests choose
      # rather than something they race.
      secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LWZvci1hdXRvbWF0ZWQtdGVzdHMtMDE=
      issuer: giaky-test
      access-token-ttl: 15m
    refresh-token:
      ttl: 30d
    verification:
      email-verify-ttl: 24h
      password-reset-ttl: 1h
    # The same cost the product ships with. Every registering fixture pays about a quarter-second
    # for it, which is a price worth paying: a suite that hashed cheaply would not be exercising
    # the thing FR-A2 actually specifies.
    bcrypt-cost: 12

management:
  endpoint:
    health:
      # HealthIT asserts components.db.status, which only exists when details are shown — the
      # default is `never`, and only the `dev` profile had turned it on.
      show-details: always

logging:
  level:
    app.giaky: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
